<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trainingsplaner</title>
<style>@font-face{font-family:"Barlow";src:url(barlow-400.woff2) format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Barlow";src:url(barlow-500.woff2) format("woff2");font-weight:500;font-display:swap}@font-face{font-family:"Barlow";src:url(barlow-600.woff2) format("woff2");font-weight:600;font-display:swap}@font-face{font-family:"Barlow Condensed";src:url(barlowcond-600.woff2) format("woff2");font-weight:600;font-display:swap}@font-face{font-family:"Barlow Condensed";src:url(barlowcond-700.woff2) format("woff2");font-weight:700;font-display:swap}</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Trainingsplaner"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="theme-color" content="#121110"><script>window.WEB_VERSION="1.8.4";window.WEB_CODE=13;window.WEB_NOTES=["Gewicht-Rad: keine doppelte Zahl mehr in der Mitte, ruhigeres Einrasten","Weicher, leicht unscharfer Übergang zum unteren Bildschirmrand"];window.WEB_APP=true</script>
<style>
/* Kraftraum: warmes Fast-Schwarz, orangegraue Flächen, Orange als Akzent. Drei Bereiche nebeneinander: Woche, Tag/Übung, Fortschritt.
   Breit: alle drei sichtbar. Mittel (Handy quer, Tablet): zwei und ein Rand. Schmal: einer, links/rechts ein Rand, wischen. */
:root{--canvas:#0B0908;--bg:#15110E;--surface:#221C17;--raise:#2E2620;--line:#3A3029;--ink:#F4EFE8;--muted:#B0A497;--accent-ink:#FFA566;--kraft:#FF8A3D;--kardio:#5B9BFF;--ok:#7DD3A8;--on-accent:#1a0f06;
  --t-kraft:#FF8A3D;--t-kardio:#5B9BFF;--t-rest:#5B4E45;--t-missed:#6E4441;--t-ink:#14100c;--t-rest-ink:#F1E4E2;--t-missed-ink:#F1E4E2;
  --sel-bg:#3A2A1F;--danger:#6E4441;--danger-ink:#F1E4E2;--toast-act:#9A4308;--shadow:rgba(0,0,0,.6);--cond:"Barlow Condensed","Arial Narrow",sans-serif;color-scheme:dark}
/* Hell: dieselbe Welt bei Tageslicht, warmes Hellgrau und Orange */
:root[data-theme="light"]{--canvas:#D8CFC5;--bg:#F6F1EB;--surface:#ECE4DB;--raise:#E2D8CD;--line:#D3C7BA;--ink:#221B16;--muted:#6B5F55;--accent-ink:#A84B0C;--kraft:#F07A2C;--kardio:#3B7DDB;--ok:#2E7D57;
  --t-kraft:#F28A44;--t-kardio:#6FA3EE;--t-rest:#CDBFB1;--t-missed:#A86A64;--t-ink:#1d1510;--t-rest-ink:#2A211B;--t-missed-ink:#FFF5F3;
  --sel-bg:#F7D9C2;--danger:#A84A44;--danger-ink:#FFF5F3;--toast-act:#FFA566;--shadow:rgba(60,40,20,.22);color-scheme:light}
:root[data-theme="light"] .graph polyline{filter:brightness(.72) saturate(1.5)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--canvas);color:var(--ink);font:400 15px/1.5 "Barlow","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
/* --peek: sichtbarer Rand der Nachbarseite, --lap: so weit liegt sie unter der Hauptseite. Erste und letzte Seite reichen bis zum Bildschirmrand. */
/* fixed + inset:0 statt 100dvh: auf dem iPhone als Web-App war 100dvh kürzer als der Bildschirm, unten blieb ein schwarzer Streifen */
.deck{--peek:40px;--lap:20px;position:fixed;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.deck::-webkit-scrollbar{display:none}
/* Weicher Übergang zum unteren Bildschirmrand: Inhalt darunter wird leicht unscharf und dunkel */
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:calc(36px + env(safe-area-inset-bottom,0px));z-index:5;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--bg));
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 70%);mask-image:linear-gradient(to bottom,transparent,#000 70%)}
/* iOS 26, installierte Web-App mit durchsichtiger Statusleiste: das Fenster ist um die Statusleiste zu kurz (unten abgeschnitten). 100lvh ist dort die volle Höhe. Bei undurchsichtiger Statusleiste ist der Abstand oben 0, dann bleibt es bei 100 %. */
@media (display-mode:standalone){@supports (height:100lvh){.deck{bottom:auto;height:min(100lvh,calc(100% + env(safe-area-inset-top,0px)))}}}
.pane{position:relative;flex:0 0 calc(100vw - 2*var(--peek));height:100%;overflow-y:auto;scroll-snap-align:center;background:var(--bg);border-inline:1px solid var(--line);box-shadow:0 0 32px var(--shadow);
  padding:max(20px,env(safe-area-inset-top,0px)) 16px calc(44px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;
  transform-origin:center;scrollbar-width:thin;scrollbar-color:var(--line) transparent;container-type:inline-size}
/* Schmale Seite (Handy mit Rändern): Ziel und letztes Mal unter die Eingabe statt daneben */
@container (max-width:360px){.pane .exgrid{grid-template-columns:minmax(0,1fr)}.pane .side{flex-direction:row}.pane .side .panel{min-width:0}}
.pane+.pane{margin-left:calc(-1*var(--lap))}
.pane:first-child{flex-basis:calc(100vw - var(--peek));scroll-snap-align:start;border-left:none;padding-left:max(16px,env(safe-area-inset-left,0px))}
.pane:last-child{flex-basis:calc(100vw - var(--peek));scroll-snap-align:end;border-right:none;padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.deck{--peek:56px;--lap:0px}.pane,.pane:first-child,.pane:last-child{flex-basis:calc((100vw - var(--peek))/2)}.pane{scroll-snap-align:start}.pane:last-child{scroll-snap-align:end}}
@media (min-width:1100px){.deck{overflow-x:hidden;scroll-snap-type:none}.pane,.pane:first-child,.pane:last-child{flex:1 1 0;min-width:0;margin-left:0;box-shadow:none;border-left:none;border-right:1px solid var(--line);padding:max(24px,env(safe-area-inset-top,0px)) 20px 48px}.pane:last-child{border-right:none}}
h1,h2,p{margin:0}
.cond,.label,.btn,.tab,.chip{font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.num{font-family:var(--cond);font-weight:600;font-variant-numeric:tabular-nums}
.big{font-size:44px;line-height:1}
.h1{font-size:36px;line-height:1}
.h2{font-size:32px;line-height:1}
.label{font-size:14px;letter-spacing:.06em;color:var(--accent-ink)}
.big .acc{color:var(--kraft)}
.muted{color:var(--muted)}
.small{font-size:13px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--kraft);outline-offset:2px}
::selection{background:var(--kraft);color:var(--on-accent)}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.head{display:flex;align-items:center;gap:10px}
.head .col{flex:1}
.row{display:flex;gap:8px;align-items:center}
.icon{width:48px;height:48px;border:none;border-radius:10px;background:var(--raise);display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.icon:active,.btn:active,.item:active,.tile:active{transform:scale(.97)}
.weekbar{display:flex;align-items:center;gap:8px}
.weekbar p{flex:1;text-align:center}
.weekbar .icon{width:44px;height:44px}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.tile{height:66px;border:none;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.tile .cond{font-size:13px;line-height:1.1}
.tile .num{font-size:24px;line-height:1.05}
.tile.today{outline:2px solid var(--kraft);outline-offset:2px}
.tile.sel{box-shadow:inset 0 -4px 0 var(--ink)}
.card{background:var(--surface);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.segs{display:grid;gap:4px}
.seg{height:8px;border-radius:2px;background:var(--line)}
.seg.done{background:var(--kraft)}
.seg.now{box-shadow:inset 0 0 0 1.5px var(--kraft)}
.btn{min-height:56px;border:none;border-radius:10px;background:var(--kraft);color:var(--on-accent);font-size:21px;padding:0 16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-size:18px;min-height:52px}
.btn.big{min-height:64px;font-size:24px;border-radius:12px}
.btn.danger{background:var(--danger);color:var(--danger-ink)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--surface);border:none;text-align:left;width:100%;min-height:60px}
.sw{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.bar{width:10px;height:34px;border-radius:3px;flex-shrink:0}
.col{display:flex;flex-direction:column;min-width:0;flex:1}
.name{font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.exrow{display:flex;gap:6px;align-items:stretch}
.exrow .item{flex:1}
.exrow .icon{height:auto;min-height:48px;background:var(--surface);color:var(--muted)}
.status{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.status.ok{color:var(--ok);display:flex;align-items:center;gap:4px}
.status svg{width:18px;height:18px}
.chip{font-size:13px;padding:4px 8px;border-radius:4px;color:#14181f;white-space:nowrap}
.exgrid{display:grid;grid-template-columns:minmax(0,1fr) 116px;gap:10px}
.panel{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:6px}
.stepper .icon{width:44px;height:44px;background:var(--line);flex-shrink:0}
.stepper .wheel{flex:1;min-width:0}
/* Scrollrad: Liste rastet auf die Mitte ein, das Feld in der Mitte zeigt die Zahl und nimmt Tippen an */
.wheel{--row:40px;--h:104px;position:relative;height:var(--h);border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.wheel::before{content:"";position:absolute;left:4px;right:4px;top:calc((var(--h) - var(--row))/2);height:var(--row);border-radius:8px;background:var(--raise)}
.wheel-list{position:relative;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior-y:contain;padding-block:calc((var(--h) - var(--row))/2);
  -webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent)}
.wheel-list::-webkit-scrollbar{display:none}
.wheel-list>div{height:var(--row);scroll-snap-align:center;display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-weight:600;font-size:22px;color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer;-webkit-user-select:none;user-select:none}
.wheel input.input,.wheel input.bignum{position:absolute;z-index:1;left:4px;right:4px;width:auto;top:calc((var(--h) - var(--row))/2);height:var(--row);padding:0;border:none;border-radius:8px;background:var(--raise);color:var(--ink);text-align:center;font-family:var(--cond);font-weight:600;pointer-events:none;transition:opacity .1s;transform:translateZ(0)}
.wheel.moving input{opacity:0}
.wheel:not(.moving) .wheel-list>.on{visibility:hidden}
.wheel input:focus{pointer-events:auto;outline:2px solid var(--kraft);outline-offset:-2px}
.wheel.big{--row:52px;--h:120px;background:transparent;box-shadow:none}
.wheel.big .wheel-list>div{font-size:30px}
.trains{margin:0;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.bignum{width:100%;min-width:0;height:56px;background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;color:var(--ink);text-align:center;font-family:var(--cond);font-weight:600;font-size:48px;line-height:1;padding:0;font-variant-numeric:tabular-nums}
.bignum:focus{outline:none;border-bottom-color:var(--kraft)}
.side{display:flex;flex-direction:column;gap:10px}
.side .panel{padding:12px;gap:2px;flex:1}
.side .v{font-size:28px;line-height:1.05}
.sets{display:flex;flex-wrap:wrap;gap:8px}
.setchip{display:flex;align-items:center;gap:6px;height:40px;padding:0 2px 0 12px;border-radius:8px;background:var(--surface)}
.setchip .num{font-size:18px}
.setchip .x{width:36px;height:36px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;color:var(--muted)}
.setchip .x svg{width:18px;height:18px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{flex-shrink:0;height:40px;padding:0 12px;border:none;border-radius:8px;background:var(--raise);font-size:15px;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{background:var(--kraft);color:var(--on-accent)}
.dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.grow{display:flex;align-items:center;gap:10px;min-height:64px;padding:8px 12px;border-radius:10px;background:var(--surface);border:none;width:100%;text-align:left}
.grow .gname{width:112px;flex-shrink:0;font-family:var(--cond);font-weight:700;text-transform:uppercase;font-size:16px;line-height:1.1;display:flex;align-items:center;gap:8px}
.grow .gbox{flex:1;min-width:0;height:44px;display:flex;align-items:center}
.grow .graph{height:44px}
.graph{width:100%;height:auto;display:block}
.graph polyline{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.nodata{font-size:13px}
.switch{display:flex;align-items:center;gap:10px;min-height:44px;border:none;background:transparent;padding:0;font-weight:500}
.switch .track{width:42px;height:24px;border-radius:12px;background:var(--line);padding:3px;display:flex}
.switch[aria-checked="true"] .track{background:var(--kraft);justify-content:flex-end}
.switch .knob{width:18px;height:18px;border-radius:50%;background:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;border:none;margin:0;padding:0;min-width:0}
.field>span,.field>legend{font-size:13px;color:var(--muted);padding:0;margin-bottom:6px}
.input{height:52px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:0 14px;font:inherit;font-size:17px;width:100%;min-width:0}
.input:focus{border-color:var(--kraft);outline:none}
textarea.input{height:120px;padding:10px;font:12px/1.4 ui-monospace,Consolas,monospace;resize:vertical}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choice{position:relative;display:block}
.choice input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.choice>span{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:8px;background:var(--raise);font-weight:600;border:2px solid transparent}
.choice input:checked+span{border-color:var(--kraft);background:var(--sel-bg)}
.choice input:focus-visible+span{outline:2px solid var(--kraft);outline-offset:2px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.msg{color:var(--accent-ink);font-size:14px;min-height:21px}
.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 6px 6px 16px;border-radius:10px;display:flex;align-items:center;gap:12px;z-index:20;width:max-content;max-width:calc(100% - 32px);font-weight:500}
.toast button{border:none;background:transparent;color:var(--toast-act);font-weight:700;min-height:40px;padding:0 10px}
.empty{color:var(--muted)}
.sep{height:1px;background:var(--line);margin:4px 0}
/* Zahnrad-Menü wie beim Tagesplaner */
.icon{position:relative}
.badge{background:#E5484D;color:#fff;border-radius:999px;min-width:18px;height:18px;font:700 11px/18px system-ui,sans-serif;text-align:center;padding:0 5px}
.icon .badge{position:absolute;top:-5px;right:-5px}
.pop{position:fixed;z-index:15;width:min(330px,calc(100vw - 24px));max-height:calc(100dvh - 90px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 18px 40px -12px var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px}
.pop .label{margin-top:6px}
.segctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--raise);padding:4px;border-radius:10px}
.segctl button{border:none;background:transparent;min-height:40px;border-radius:8px;font-weight:600}
.segctl button[aria-pressed="true"]{background:var(--kraft);color:var(--on-accent)}
.soft{min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--kraft)}
.times{display:grid;grid-template-columns:repeat(2,auto minmax(0,1fr));gap:6px 10px;align-items:center}
.times input{height:40px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:0 8px;font:inherit;min-width:0}
.tagx{font-family:var(--cond);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.05em;padding:2px 6px;border-radius:4px;border:1px solid var(--accent-ink);color:var(--accent-ink);margin-left:6px;vertical-align:2px}
.tour{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100vw - 32px));background:var(--surface);border:2px solid var(--kraft);
  border-radius:16px;padding:16px;z-index:18;box-shadow:0 18px 40px -12px var(--shadow);display:flex;flex-direction:column;gap:10px}
.pane.focus{outline:3px solid var(--kraft);outline-offset:-3px}
</style>
</head>
<body>
<main class="deck" id="deck">
<section class="pane" id="p-week" aria-label="Woche"></section>
<section class="pane" id="p-mid" aria-label="Tag und Übung" aria-live="polite"></section>
<section class="pane" id="p-prog" aria-label="Fortschritt"></section>
</main>
<script>
/*LOGIK*/
const GROUPS = [
  { key: "beine", name: "Beine", color: "#9FD8B8", muscles: "Quadrizeps, Beinbeuger, Waden, Adduktoren" },
  { key: "po", name: "Po", color: "#F2B3C6", muscles: "Großer und mittlerer Gesäßmuskel" },
  { key: "ur", name: "Unterer Rücken", color: "#E6C79C", muscles: "Rückenstrecker" },
  { key: "or", name: "Oberer Rücken", color: "#AFC3EE", muscles: "Latissimus, Trapez, Rautenmuskeln, hintere Schulter" },
  { key: "bauch", name: "Bauch", color: "#EEDC8E", muscles: "Gerader Bauchmuskel, schräge Bauchmuskeln" },
  { key: "brust", name: "Brust", color: "#F6B99A", muscles: "Großer und kleiner Brustmuskel" },
  { key: "schulter", name: "Schultern & Nacken", color: "#C8B4EA", muscles: "Vordere, seitliche und hintere Schulter, oberer Trapez" },
  { key: "arme", name: "Arme", color: "#9FD9E2", muscles: "Bizeps, Trizeps, Unterarme" }
];
// Typische Splits: eine Übung kann statt einer Muskelgruppe einen Split haben. Gespeichert wie eine Gruppe (ex.group = key).
const SPLITS = [
  { key: "push", name: "Push", color: "#F59A9A", muscles: "Brust, vordere und seitliche Schulter, Trizeps" },
  { key: "pull", name: "Pull", color: "#B8DB8E", muscles: "Latissimus, Trapez, Rautenmuskeln, hintere Schulter, Bizeps, Unterarme" },
  { key: "oben", name: "Oberkörper", color: "#E7A6E0", muscles: "Brust, Latissimus, Trapez, Schultern, Bizeps, Trizeps" },
  { key: "unten", name: "Unterkörper", color: "#E8C26E", muscles: "Quadrizeps, Beinbeuger, Gesäß, Waden, Rückenstrecker" },
  { key: "ganz", name: "Ganzkörper", color: "#D9D2CA", muscles: "Beine, Gesäß, Rücken, Brust, Schultern, Arme, Bauch" }
];
const CATS = GROUPS.concat(SPLITS);
const KARDIO = { key: "kardio", name: "Kardio", color: "#5B9BFF" };
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

const monday = s => addDays(s, -weekday(s));

const emptyWeek = () => [[], [], [], [], [], [], []];

  return { v: 1, rhythm: 1, start: monday(today), plan: [emptyWeek(), emptyWeek()], days: {}, ex: {}, log: {} };

// Plan-Woche: 0 = A, 1 = B. Im 1-Wochen-Rhythmus immer A.

// Übungen eines Tages: eine Änderung nur für diesen Tag geht vor, sonst die Wochenvorlage.

}

  const k = list.some(id => st.ex[id].kind === "kraft"), c = list.some(id => st.ex[id].kind === "kardio");

// Bewegtes Gewicht: Summe aus Gewicht × Wiederholungen. Körpergewicht (0 kg) ergibt 0 und zählt nicht.

    let sum = 0;
    for (const id in st.log[ds]) { const ex = st.ex[id]; if (ex && test(ex, id)) sum += value(st.log[ds][id], ex) || 0; }
    return sum > 0 ? [ds, sum] : null;

}

}

/* Speichern: in der Android-App als Datei, im Browser im Browser-Speicher, im Artifact zusätzlich in der Datenbank. */
const KEY = "trainingsplaner.zustand";
const native = window.AndroidStore;

  get(k, d) { try { const v = native ? native.get(k) : localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

// Beim ersten Öffnen: zwei Beispielübungen für heute, mit drei alten Einträgen, damit man den Fortschritt sieht.
function withSamples(s0) {
  const t = today(), wd = weekday(t);
  s0.ex.bsp1 = { name: "Kniebeugen", kind: "kraft", group: "beine", kg: 40, reps: 10, sets: 3, sample: true };
  s0.ex.bsp2 = { name: "Laufband", kind: "kardio", track: "dauer", min: 20, kcal: 0, sample: true };
  s0.plan[0][wd] = ["bsp1", "bsp2"];
  [3, 2, 1].forEach((w, i) => {
    const kg = 30 + i * 5;
    s0.log[addDays(t, -7 * w)] = { bsp1: { sets: [{ kg: kg, reps: 10 }, { kg: kg, reps: 10 }, { kg: kg, reps: 8 }] }, bsp2: { min: 15 + i * 3, kcal: 0 } };
  });

}
const firstRun = !valid(kv.get(KEY, null));
let st = valid(kv.get(KEY, null)) || withSamples(newState(today()));
let db = null, dbTimer = null;

  if (db) { clearTimeout(dbTimer); dbTimer = setTimeout(() => db.doc("zustand/haupt").set({ json: s }).catch(() => { }), 500); }

/* Erinnerungen (nur Android-App): die Seite rechnet die nächsten 14 Tage aus, die App stellt daraus den Wecker. */
const RM_KEY = "trainingsplaner.erinnerung";
let rm = kv.get(RM_KEY, null) || { on: false, times: ["17:00", "17:00", "17:00", "17:00", "17:00", "10:00", "10:00"], events: [] };
function writeReminders() {
  if (!native) return;
  const t = today(), now = Date.now(), events = [];
  if (rm.on) for (let d = 0; d < 14; d++) {
    const ds = addDays(t, d), list = dayList(st, ds), hm = rm.times[weekday(ds)];
    if (!list.length || !/^\d\d:\d\d$/.test(hm || "")) continue;
    const log = st.log[ds] || {};
    if (d === 0 && list.every(id => entryDone(st.ex[id], log[id]))) continue;
    const p = parse(ds); p.setHours(+hm.slice(0, 2), +hm.slice(3, 5), 0, 0);
    if (p.getTime() > now) events.push({ at: p.getTime(), title: "Training heute", text: summary(list), id: 100 + d });
  }
  rm.events = events;
  kv.set(RM_KEY, rm);

/* Drei Bereiche: links die Woche, in der Mitte Tag, Übung, Formular oder Einstellungen (mit eigenem Zurück), rechts der Fortschritt. */
let weekOff = 0;
const prog = { sel: "alle", single: false };
const stack = [];
// Mitte beim Start wie in der Probe: die nächste offene Übung von heute, sonst der heutige Tag.
function startMid() {
  const t = today(), log = st.log[t] || {}, id = dayList(st, t).find(x => !entryDone(st.ex[x], log[x]));
  stack.length = 0;
  if (!id) return { view: "day", ds: t };
  stack.push({ view: "day", ds: t });

}
let ui = startMid();
const PANES = ["p-week", "p-mid", "p-prog"];
function go(next) { stack.push(ui); ui = next; render(); $("#p-mid").scrollTop = 0; show(1); }
function openMid(next, base) { stack.length = 0; if (base) stack.push(base); ui = next; render(); $("#p-mid").scrollTop = 0; show(1); }
function back() { ui = stack.pop() || { view: "day", ds: today() }; render(); }
window.appBack = () => {
  if ($(".sheet-wrap")) { closeSheet(); return true; }
  if ($(".pop")) { closePop(); return true; }
  if (tourAt >= 0) { tour(-1); return true; }
  if (stack.length) { back(); return true; }
  if (swipes() && current() !== 0) { show(0); return true; }
  return false;
};

function render() {
  [VIEWS.week, VIEWS[ui.view] || VIEWS.day, VIEWS.progress].forEach((view, i) => {
    const el = document.getElementById(PANES[i]), y = el.scrollTop;
    el.innerHTML = view(); el.scrollTop = y; el.querySelectorAll(".wheel").forEach(setupWheel);
  });
}

/* Wischen auf dem Handy: der Bereich in der Mitte ist voll da, die Nachbarn rücken etwas nach hinten. */
const deck = $("#deck");
const swipes = () => deck.scrollWidth > deck.clientWidth + 4;
function current() {
  const mid = deck.scrollLeft + deck.clientWidth / 2;
  let best = 0, dist = Infinity;
  PANES.forEach((id, i) => { const p = document.getElementById(id), d = Math.abs(p.offsetLeft + p.offsetWidth / 2 - mid); if (d < dist) { dist = d; best = i; } });
  return best;
}
function show(i) {
  if (!swipes()) return;
  const p = document.getElementById(PANES[i]), max = deck.scrollWidth - deck.clientWidth;
  const left = i === 0 ? 0 : i === 2 ? max : Math.min(max, window.innerWidth >= 700 ? p.offsetLeft : p.offsetLeft - (deck.clientWidth - p.offsetWidth) / 2);
  deck.scrollTo({ left: left, behavior: "auto" });
}
let raf = 0;
function depth() {
  raf = 0;
  const on = swipes() && window.innerWidth < 700, still = matchMedia("(prefers-reduced-motion: reduce)").matches, mid = deck.scrollLeft + deck.clientWidth / 2;
  PANES.forEach(id => {
    const p = document.getElementById(id);
    if (!on) {
      // quer (zwei Bereiche): nur den angeschnittenen Bereich abdunkeln
      const r = p.getBoundingClientRect(), seen = Math.max(0, Math.min(r.right, window.innerWidth) - Math.max(r.left, 0)) / r.width;
      p.style.transform = ""; p.style.zIndex = ""; p.style.filter = swipes() && seen < .95 ? "brightness(.6)" : ""; return;
    }
    const d = Math.min(1, Math.abs(p.offsetLeft + p.offsetWidth / 2 - mid) / p.offsetWidth);
    // Die ganz sichtbare Seite bekommt weder Filter noch Verformung: beides machte die Schrift auf dem iPhone unscharf.
    const r = p.getBoundingClientRect(), front = Math.min(r.right, window.innerWidth) - Math.max(r.left, 0) >= r.width - 2;
    p.style.transform = still || front ? "" : "scale(1," + (1 - .05 * d).toFixed(3) + ")";   // nur flacher, damit der Rand gleich breit bleibt

deck.addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(depth); clearTimeout(depthTimer); depthTimer = setTimeout(depth, 120); }, { passive: true });   // Zeitgeber: Endstand auch, wenn das Fenster keine Bilder zeichnet
window.addEventListener("resize", () => { if (!raf) raf = requestAnimationFrame(depth); });

/* Scrollrad: Zahlen wischen, die Mitte antippen zum Tippen. Das Eingabefeld bleibt die Quelle der Zahl, das Rad schreibt hinein. */
const WHEEL = { kg: [2.5, 300], reps: [1, 100], sets: [1, 20], min: [1, 300], kcal: [10, 3000] };   // Schritt, Höchstwert
const wheel = (input, key, big) => '<div class="wheel' + (big ? ' big' : '') + '" data-wheel="' + key + '"><div class="wheel-list" aria-hidden="true"></div>' + input + '</div>';
function setupWheel(w) {
  const list = w.firstChild, inp = w.querySelector("input"), v = toNum(inp.value), c = WHEEL[w.dataset.wheel], vals = [];
  for (let x = w.dataset.wheel === "sets" ? 1 : 0; x <= c[1] + 1e-9; x = Math.round((x + c[0]) * 100) / 100) vals.push(x);
  if (vals.indexOf(v) < 0) { vals.push(v); vals.sort((a, b) => a - b); }   // getippte Zahl außerhalb des Rasters kommt dazu
  if (inp.value === "") inp.value = num(v);
  list.innerHTML = vals.map(x => '<div>' + num(x) + '</div>').join("");
  w._vals = vals;
  list.scrollTop = w._target = vals.indexOf(v) * list.firstChild.offsetHeight;
  markWheel(w, vals.indexOf(v));
}
// Die Zahl in der Mitte der Liste wird ausgeblendet, solange das Feld darüber sie zeigt. Sonst scheint sie auf dem iPhone durch (das Scrollfeld malt dort über dem Eingabefeld).
function markWheel(w, i) { if (w._on) w._on.classList.remove("on"); w._on = w.firstChild.children[i] || null; if (w._on) w._on.classList.add("on"); }
function wheelAt(list) { return Math.round(list.scrollTop / list.firstChild.offsetHeight); }
document.addEventListener("scroll", e => {
  const list = e.target;
  if (!list.classList || !list.classList.contains("wheel-list")) return;
  const w = list.parentNode;
  if (Math.abs(list.scrollTop - w._target) < 1 && !w.classList.contains("moving")) return;   // eigener Sprung beim Einstellen, nicht vom Wischen
  w.classList.add("moving"); clearTimeout(w._t);
  w._t = setTimeout(() => {
    w.classList.remove("moving");
    markWheel(w, wheelAt(list));
    const inp = w.querySelector("input"), v = w._vals[wheelAt(list)];
    if (v != null && toNum(inp.value) !== v) { inp.value = num(v); inp.dispatchEvent(new Event("input", { bubbles: true })); }
  }, 150);   // etwas warten: beim Ausrollen kommen auf dem iPhone die Scroll-Meldungen in Abständen
}, true);
document.addEventListener("click", e => {
  const item = e.target.closest && e.target.closest(".wheel-list>div");
  if (!item) return;
  const list = item.parentNode, i = Array.prototype.indexOf.call(list.children, item);
  if (i === wheelAt(list)) { const inp = list.parentNode.querySelector("input"); inp.focus(); inp.select(); }

// iPhone: Nach dem Schließen der Tastatur bleibt das Fenster manchmal verschoben, dann treffen Fingertipps nicht mehr den Knopf, den man sieht. Die Seite selbst scrollt nie, also zurück auf 0.

if (window.visualViewport) visualViewport.addEventListener("resize", unshift);
document.addEventListener("keydown", e => {
  const w = e.target.closest && e.target.closest(".wheel");
  if (!w || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
  e.preventDefault();
  const list = w.firstChild, h = list.firstChild.offsetHeight, i = Math.max(0, Math.min(w._vals.length - 1, wheelAt(list) + (e.key === "ArrowUp" ? 1 : -1)));
  list.scrollTop = w._target = i * h; markWheel(w, i); e.target.value = num(w._vals[i]); e.target.dispatchEvent(new Event("input", { bubbles: true }));
});

function head(title, sub) {
  return '<header class="head">' + (stack.length ? '<button class="icon" data-act="back" aria-label="Zurück">' + I.back + '</button>' : '') + '<div class="col"><h1 class="cond h1">' + esc(title) + '</h1>' + (sub ? '<p class="muted small">' + esc(sub) + '</p>' : '') + '</div></header>';
}
function target(ex) {

  const p = [];
  if (ex.track !== "kcal") p.push(ex.min + " min");
  if (ex.track !== "dauer") p.push(ex.kcal + " kcal");
  return p.join(" · ");
}
function summary(list) {
  const names = [];
  list.forEach(id => { const ex = st.ex[id], n = ex.kind === "kardio" ? ex.name : groupOf(ex).name; if (names.indexOf(n) < 0) names.push(n); });
  return names.join(" · ");
}
function dayTitle(ds) { const d = parse(ds); return WDL[weekday(ds)] + ", " + d.getDate() + ". " + MON[d.getMonth()]; }

const VIEWS = {};

VIEWS.week = () => {

  const range = dm.getDate() + "." + (dm.getMonth() !== ds2.getMonth() ? " " + MONS[dm.getMonth()] : "") + "–" + ds2.getDate() + ". " + MONS[ds2.getMonth()] + (AB(st) ? " · " + planLabel(mon) + " von 2" : "");
  let tiles = "";
  for (let i = 0; i < 7; i++) {

    tiles += '<button class="tile' + (ds === t ? ' today' : '') + (ds === open ? ' sel' : '') + '"' + (ds === open ? ' aria-current="date"' : '') + ' style="background:' + tileBg(k) + ';color:' + tileInk(k) + '" data-act="day" data-ds="' + ds + '" aria-label="' + WDL[i] + ' ' + fmt(ds) + ', ' + KIND[k] + (ds === t ? ', heute' : '') + '"><span class="cond">' + WD[i] + '</span><span class="num">' + parse(ds).getDate() + '</span></button>';
  }

    '<div class="weekbar"><button class="icon" data-act="week" data-d="-1" aria-label="Vorige Woche">' + I.back + '</button><p class="muted">' + range + '</p>' +

function todayCard(t) {
  const list = dayList(st, t), d = parse(t), lbl = '<span class="label">Heute · ' + WDL[weekday(t)] + ' ' + d.getDate() + '.</span>';
  if (!list.length) {

    return '<article class="card">' + lbl + '<h2 class="cond h2">' + (first ? 'Los geht’s' : 'Ruhetag') + '</h2><p class="muted">' +
      (first ? 'Lege deine erste Übung für heute an oder tippe oben auf einen anderen Tag.' : 'Heute steht nichts im Plan.') + '</p>' +
      '<button class="btn" data-act="' + (first ? 'form' : 'day') + '" data-ds="' + t + '">' + (first ? 'Erste Übung anlegen' : 'Tag öffnen') + '</button></article>';
  }
  const log = st.log[t] || {}, done = list.filter(id => entryDone(st.ex[id], log[id])), nextId = list.find(id => !entryDone(st.ex[id], log[id]));

  return '<article class="card">' + lbl + '<h2 class="cond h2">' + esc(summary(list)) + '</h2>' +
    '<div class="segs" style="grid-template-columns:repeat(' + list.length + ',minmax(0,1fr))" role="img" aria-label="' + done.length + ' von ' + list.length + ' Übungen erledigt">' + segs + '</div>' +
    '<p class="muted small">' + done.length + ' von ' + list.length + ' Übungen erledigt</p>' +

function upcoming(t) {
  const rows = [];
  for (let i = 1; i <= 14 && rows.length < 2; i++) {
    const ds = addDays(t, i), list = dayList(st, ds);

  return rows.length ? '<section class="list" aria-label="Als Nächstes"><span class="label">Als Nächstes</span>' + rows.join("") + '</section>' : '';

VIEWS.day = () => {
  const ds = ui.ds, t = today(), list = dayList(st, ds), k = dayKind(st, ds, t), log = st.log[ds] || {};

  const sub = KIND[k] + (list.length ? " · " + done + " von " + list.length + " erledigt" : "") + (planLabel(ds) ? " · " + planLabel(ds) : "") + (st.days[ds] ? " · nur dieser Tag geändert" : "");
  let html = head(dayTitle(ds), sub);
  if (!list.length) html += '<p class="empty">Ruhetag. Lege eine Übung an, dann wird daraus ein Trainingstag.</p>';
  html += '<div class="list">' + list.map(id => {
    const ex = st.ex[id], g = groupOf(ex), e = log[id], ok = entryDone(ex, e);
    const status = ok ? '<span class="status ok">' + I.check + 'erledigt</span>'
      : ex.kind === "kraft" && e && e.sets.length ? '<span class="status">' + e.sets.length + ' von ' + ex.sets + ' Sätzen</span>' : '<span class="status">offen</span>';

VIEWS.ex = () => {
  const ds = ui.ds, id = ui.id, ex = st.ex[id];

  const side = '<aside class="side" aria-label="Ziel und letztes Mal"><div class="panel"><span class="label">Ziel</span>' + (ex.kind === "kraft"
    ? '<span class="num v">' + num(ex.kg) + ' kg</span><span class="small">' + ex.reps + ' Reps</span><span class="small">' + ex.sets + ' Sätze</span>'

    '<button class="btn ghost" style="min-height:40px;font-size:14px;margin-top:8px" data-act="edit">Ziel ändern</button></div>' +
    '<div class="panel"><span class="label">Letztes Mal</span>' + (last ? '<span class="small muted">' + fmt(last.ds) + '</span>' + (ex.kind === "kraft"
      ? '<span class="num v">' + num(Math.max.apply(null, last.e.sets.map(s => s.kg))) + ' kg</span><span class="num" style="font-size:17px">' + last.e.sets.map(s => s.reps).join(" · ") + '</span>'
      : (last.e.min > 0 ? '<span class="num v">' + last.e.min + ' min</span>' : '') + (last.e.kcal > 0 ? '<span class="num" style="font-size:18px">' + last.e.kcal + ' kcal</span>' : ''))
      : '<span class="small muted">Noch kein Eintrag</span>') + '</div></aside>';
  if (ex.kind === "kraft") {
    const sets = (e && e.sets) || [], n = sets.length, lastSet = sets[n - 1];
    if (ui.kg == null) ui.kg = num(lastSet ? lastSet.kg : ex.kg);
    if (ui.reps == null) ui.reps = String(lastSet ? lastSet.reps : ex.reps);
    html += '<div class="exgrid"><div class="panel"><span class="label" style="color:var(--kraft)">' + (n < ex.sets ? 'Satz ' + (n + 1) + ' von ' + ex.sets : 'Extra-Satz ' + (n + 1)) + '</span>' +
      stepper("kg", "Gewicht", "kg", 2.5) + stepper("reps", "Wiederholungen", "", 1) + '</div>' + side + '</div>';
    if (n) html += '<div class="sets">' + sets.map((s, i) => '<span class="setchip"><span class="muted">' + (i + 1) + '</span><span class="num">' + num(s.kg) + ' × ' + s.reps + '</span><button class="x" data-act="delset" data-i="' + i + '" aria-label="Satz ' + (i + 1) + ' löschen">' + I.x + '</button></span>').join("") + '</div>';
    html += '<p class="msg" role="status">' + (ui.msg || (n >= ex.sets ? 'Alle ' + ex.sets + ' Sätze geschafft.' : '')) + '</p>';
    html += '<button class="btn big" data-act="saveset">Satz speichern</button>';
  } else {
    if (ui.min == null) ui.min = String(e && e.min ? e.min : ex.min || 0);
    if (ui.kcal == null) ui.kcal = String(e && e.kcal ? e.kcal : ex.kcal || 0);
    html += '<div class="exgrid"><div class="panel"><span class="label" style="color:var(--kardio)">' + (hasEntry(e) ? 'Gespeichert' : 'Eintragen') + '</span>' +
      (ex.track !== "kcal" ? stepper("min", "Dauer", "min", 5) : '') + (ex.track !== "dauer" ? stepper("kcal", "Kalorien", "kcal", 10) : '') + '</div>' + side + '</div>';
    html += '<p class="msg" role="status">' + (ui.msg || '') + '</p>';
    html += '<button class="btn big" data-act="savecardio">' + (hasEntry(e) ? 'Änderung speichern' : 'Speichern') + '</button>';
    if (hasEntry(e)) html += '<button class="btn ghost" data-act="delcardio">Eintrag löschen</button>';
  }
  const list = dayList(st, ds), log = st.log[ds] || {}, after = list.slice(list.indexOf(id) + 1).concat(list.slice(0, list.indexOf(id))).find(x => !entryDone(st.ex[x], log[x]));
  if (after) html += '<button class="item" data-act="ex" data-ds="' + ds + '" data-id="' + after + '" style="border:1px solid var(--line);background:transparent"><span class="label">Danach</span><span class="col"><span class="name">' + esc(st.ex[after].name) + '</span></span><span class="num muted" style="font-size:17px">' + target(st.ex[after]) + '</span></button>';
  return html;
};

function stepper(field, label, unit, step) {
  return '<div class="col" style="gap:2px"><span class="small muted">' + label + (unit ? ' (' + unit + ')' : '') + '</span><div class="stepper">' +
    '<button class="icon" data-act="step" data-field="' + field + '" data-d="' + (-step) + '" aria-label="' + label + ' weniger">' + I.minus + '</button>' +
    wheel('<input class="bignum" inputmode="decimal" autocomplete="off" data-field="' + field + '" value="' + esc(ui[field]) + '" aria-label="' + label + (unit ? ' in ' + unit : '') + '">', field, true) +
    '<button class="icon" data-act="step" data-field="' + field + '" data-d="' + step + '" aria-label="' + label + ' mehr">' + I.plus + '</button></div></div>';
}

function graph(lines, w, h, shared, label, stretch) {
  const all = [].concat.apply([], lines.map(l => l.pts));
  if (!all.length) return '<p class="muted nodata">Noch keine Daten</p>';
  const ts = all.map(p => parse(p[0]).getTime()), t0 = Math.min.apply(null, ts), t1 = Math.max.apply(null, ts);
  const span = pts => { const v = pts.map(p => p[1]); return [Math.min.apply(null, v), Math.max.apply(null, v)]; };
  const gs = span(all), P = 6;
  const body = lines.map(l => {
    if (!l.pts.length) return "";
    const r = shared ? gs : span(l.pts);
    const xy = l.pts.map(p => [P + (t1 > t0 ? (parse(p[0]).getTime() - t0) / (t1 - t0) : .5) * (w - 2 * P), h - P - (r[1] > r[0] ? (p[1] - r[0]) / (r[1] - r[0]) : .5) * (h - 2 * P)]);
    const end = xy[xy.length - 1];
    return '<polyline points="' + xy.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" ") + '" style="stroke:' + l.color + (l.dash ? ';stroke-dasharray:' + l.dash : '') + '"/>' +
      (stretch ? '' : '<circle cx="' + end[0].toFixed(1) + '" cy="' + end[1].toFixed(1) + '" r="4" style="fill:' + l.color + ';stroke:none"/>');
  }).join("");
  return '<svg class="graph" viewBox="0 0 ' + w + ' ' + h + '"' + (stretch ? ' preserveAspectRatio="none"' : '') + ' role="img" aria-label="' + esc(label) + '"><line x1="0" y1="' + (h - 1) + '" x2="' + w + '" y2="' + (h - 1) + '" style="stroke:var(--line);stroke-width:1"/>' + body + '</svg>' +
    (stretch ? '' : '<div class="axis"><span>' + fmt(iso(new Date(t0))) + '</span><span>' + fmt(iso(new Date(t1))) + '</span></div>');
}
const groupSeries = key => series(st, ex => ex.kind === "kraft" && ex.group === key, volume);
const cardioLines = () => [
  { name: "Dauer", pts: series(st, ex => ex.kind === "kardio", e => Number(e.min) || 0), color: KARDIO.color, dash: "" },
  { name: "Kalorien", pts: series(st, ex => ex.kind === "kardio", e => Number(e.kcal) || 0), color: "var(--ink)", dash: "7 5" }
];

VIEWS.progress = () => {
  const all = [KARDIO].concat(GROUPS, SPLITS.filter(s => Object.keys(st.ex).some(id => st.ex[id].kind === "kraft" && st.ex[id].group === s.key)));
  let html = '<header class="head"><div class="col"><h1 class="cond h1">Fortschritt</h1><p class="muted small">Bewegtes Gesamtgewicht, ohne Einheiten</p></div></header>';
  html += '<div class="tabs" role="tablist" aria-label="Graph wählen">' + [{ key: "alle", name: "Alle" }].concat(all).map(g =>
    '<button class="tab" role="tab" aria-selected="' + (prog.sel === g.key) + '" data-act="sel" data-key="' + g.key + '">' + (g.color ? '<span class="dot" style="background:' + g.color + '"></span>' : '') + esc(g.name) + '</button>').join("") + '</div>';
  if (prog.sel === "alle") {
    html += '<div class="list">' + all.map(g => {
      const cl = g.key === "kardio" ? cardioLines() : null;
      const lines = cl ? [cl[0].pts.length ? cl[0] : cl[1]] : [{ pts: groupSeries(g.key), color: g.color }];
      return '<button class="grow" data-act="sel" data-key="' + g.key + '"><span class="gname"><span class="dot" style="background:' + g.color + '"></span>' + esc(g.name) + '</span><span class="gbox">' + graph(lines, 200, 44, false, "Verlauf " + g.name, true) + '</span></button>';
    }).join("") + '</div>';
    return html + '<p class="muted small">Übungen mit Körpergewicht (0 kg) zählen nicht mit.</p>';
  }
  const g = all.find(x => x.key === prog.sel) || KARDIO;
  let lines, legend = "";
  if (g.key === "kardio") {
    lines = cardioLines();
    legend = lines.map(l => '<div class="row" style="min-height:40px"><svg viewBox="0 0 28 10" style="width:28px;height:10px" aria-hidden="true"><line x1="1" y1="5" x2="27" y2="5" style="stroke:' + l.color + (l.dash ? ';stroke-dasharray:' + l.dash : '') + '"/></svg><span class="name">' + l.name + '</span></div>').join("");
  } else if (prog.single) {
    const ids = Object.keys(st.ex).filter(id => st.ex[id].kind === "kraft" && st.ex[id].group === g.key);
    lines = ids.map((id, i) => ({ name: st.ex[id].name, pts: series(st, (ex, x) => x === id, volume), color: i % 2 ? "var(--ink)" : g.color, dash: DASH[Math.floor(i / 2) % DASH.length] })).filter(l => l.pts.length);
    legend = lines.map(l => '<div class="row" style="min-height:40px"><svg viewBox="0 0 28 10" style="width:28px;height:10px" aria-hidden="true"><line x1="1" y1="5" x2="27" y2="5" style="stroke:' + l.color + (l.dash ? ';stroke-dasharray:' + l.dash : '') + '"/></svg><span class="name">' + esc(l.name) + '</span></div>').join("");
  } else lines = [{ pts: groupSeries(g.key), color: g.color }];
  html += '<article class="card"><div class="row" style="justify-content:space-between"><h2 class="cond h2">' + esc(g.name) + '</h2>' +
    (g.key !== "kardio" ? '<button class="switch" role="switch" aria-checked="' + !!prog.single + '" data-act="single">Übungen einzeln<span class="track"><span class="knob"></span></span></button>' : '') + '</div>' +
    graph(lines, 320, 200, g.key !== "kardio", "Verlauf " + g.name, false) + (legend ? '<div>' + legend + '</div>' : '') + '</article>';
  return html + (g.key === "kardio" ? '<p class="muted small">Dauer und Kalorien haben je eine eigene Skala.</p>' : '<p class="muted small">Übungen mit Körpergewicht (0 kg) zählen nicht mit.</p>');
};

/* Darstellung: Hell, Dunkel oder wie das System. Gilt nur auf diesem Gerät. Ohne Wahl dunkel wie in der Probe. */
const THEME_KEY = "trainingsplaner.theme";
let hostTheme = document.documentElement.getAttribute("data-theme");
let themeChoice = kv.get(THEME_KEY, "dark");
const sysLight = window.matchMedia("(prefers-color-scheme: light)");
const themeNow = () => themeChoice || hostTheme || (sysLight.matches ? "light" : "dark");
function applyTheme() { document.documentElement.setAttribute("data-theme", themeNow()); }
new MutationObserver(() => {
  const now = document.documentElement.getAttribute("data-theme");
  if (now === themeNow()) return;
  if (!themeChoice) hostTheme = now;   // der Artifact-Viewer stellt sein Design um
  else applyTheme();                   // eigene Wahl bleibt
}).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
if (sysLight.addEventListener) sysLight.addEventListener("change", () => { if (!themeChoice) applyTheme(); });
applyTheme();

function updSheet(title, text, notes, canGet) {
  sheet('<h2 class="cond h2">' + esc(title) + '</h2><p>' + esc(text) + '</p>' +
    (notes && notes.length ? '<ul style="margin:0;padding-left:20px">' + notes.map(n => '<li>' + esc(n) + '</li>').join("") + '</ul>' : '') +
    (canGet ? '<button class="btn" data-act="updget">' + (app ? 'Herunterladen' : 'Jetzt aktualisieren') + '</button>' : '') + '<button class="btn ghost" data-act="close">' + (canGet ? 'Später' : 'OK') + '</button>');
}
function showUpdate(offline) {
  if (offline) updSheet("Keine Verbindung", "Ob es ein Update gibt, lässt sich gerade nicht prüfen. Hast du Internet?");
  else if (upd) updSheet("Update verfügbar", "Version " + upd.name + " ist da, du hast " + curName() + ".", upd.notes, true);
  else updSheet("Alles aktuell", "Die App ist auf dem neuesten Stand (Version " + curName() + ").");
}
function checkUpdate() {
  if (app) return app.checkUpdate();
  fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : null).catch(() => null).then(t => window.appUpdateInfo(t));
}
if (app || webUpd) window.appUpdateInfo = body => {
  let v = null;
  try { v = JSON.parse(body); } catch (e) { }
  clearTimeout(updTimer);
  upd = v && +v.code > curCode() ? v : null;
  render(); refreshPop();
  if (updAsked) { updAsked = false; showUpdate(!v); }
  // pro neuer Version einmal von selbst, aber nicht über ein offenes Fenster (z. B. „Update erfolgreich!“), dann beim nächsten Start
  else if (upd && !$(".sheet-wrap") && kv.get("trainingsplaner.updGezeigt", 0) !== +upd.code) { kv.set("trainingsplaner.updGezeigt", +upd.code); showUpdate(); }
};

/* Zahnrad-Menü */
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function popHtml() {
  let h = '<span class="label">Darstellung</span><div class="segctl" role="group" aria-label="Darstellung">' +
    [["light", "Hell"], ["dark", "Dunkel"], ["", "Wie System"]].map(o => '<button data-act="theme" data-v="' + o[0] + '" aria-pressed="' + (themeChoice === o[0]) + '">' + o[1] + '</button>').join("") + '</div>';
  h += '<span class="label">Benachrichtigungen</span>';
  if (native) {
    h += '<label class="check"><input type="checkbox" data-rm="on"' + (rm.on ? ' checked' : '') + '>Trainings-Erinnerung</label>';
    if (rm.on) h += '<p class="muted small">Nur an Tagen mit Training. Feld leer lassen: an diesem Wochentag keine Erinnerung.</p><div class="times">' +
      WD.map((d, i) => '<label for="rm-' + i + '" class="small">' + d + '</label><input type="time" id="rm-' + i + '" data-rm="' + i + '" value="' + esc(rm.times[i] || "") + '">').join("") + '</div>';
  } else h += '<p class="muted small">Gibt es nur in der Android-App.</p>' + (ios ? '' : '<a class="soft" href="' + APK_URL + '">Android-App laden</a>');
  if (app || webUpd || canInstall()) {
    h += '<span class="label">App</span>';
    if (app || webUpd) h += '<button class="soft" data-act="updcheck">' + (updAsked ? 'Sucht …' : 'Nach Updates suchen') + (upd ? '<b class="badge">1</b>' : '') + '</button>';
    if (canInstall()) h += '<button class="soft" data-act="install">App installieren</button>';
  }
  h += '<span class="label">Plan</span><button class="soft" data-act="plan">Rhythmus und Sicherung</button>';
  h += '<span class="label">Hilfe</span><button class="soft" data-act="tour">Tutorial starten</button>';
  return h + '<p class="muted small">Version ' + esc(app ? app.versionName() : (window.WEB_VERSION || "1.0")) + (app ? '' : window.claude ? ' · Artifact' : window.WEB_APP ? ' · Web-App' : ' · Browser') + '</p>';
}
function placePop(p) {
  const b = document.getElementById("set-btn");
  if (!b) return;
  const r = b.getBoundingClientRect(), w = p.offsetWidth;
  p.style.top = Math.round(r.bottom + 8) + "px";
  p.style.left = Math.round(Math.max(12, Math.min(r.right - w, window.innerWidth - w - 12))) + "px";
}
function openPop() {
  closePop();
  const p = document.createElement("div");
  p.className = "pop"; p.setAttribute("role", "dialog"); p.setAttribute("aria-label", "Einstellungen");
  p.innerHTML = popHtml(); document.body.append(p); placePop(p);
  const b = document.getElementById("set-btn"); if (b) b.setAttribute("aria-expanded", "true");
  p.querySelector("button, input").focus();
}
function closePop() {
  const p = $(".pop"); if (!p) return;
  p.remove();
  const b = document.getElementById("set-btn"); if (b) b.setAttribute("aria-expanded", "false");
}
function refreshPop() { const p = $(".pop"); if (p) { p.innerHTML = popHtml(); placePop(p); } }
document.addEventListener("click", e => { if ($(".pop") && !e.target.closest(".pop, #set-btn")) closePop(); }, true);
document.addEventListener("scroll", e => { if ($(".pop") && !(e.target.closest && e.target.closest(".pop, .wheel-list"))) closePop(); }, true);   // Räder stellen sich beim Zeichnen selbst ein, das soll das Menü nicht schließen
window.addEventListener("resize", closePop);

/* Kurzes Tutorial: beim ersten Öffnen einmal von selbst, sonst über das Zahnrad */
const TOUR = [
  [0, "Deine Woche", "Orange ist Kraft, Blau Kardio, Grau Ruhetag, Dunkelrot ein verpasster Tag. Tippe auf einen Tag, dann öffnet er sich in der Mitte."],
  [1, "Übung eintragen", "Hier trägst du jeden Satz ein. Plus und Minus ändern Gewicht und Wiederholungen. Daneben oder darunter stehen dein Ziel und was du letztes Mal geschafft hast."],
  [2, "Fortschritt", "Die Linien zeigen, wie viel Gewicht du über die Zeit bewegst. Tippe auf eine Gruppe, um nur sie zu sehen, auch einzeln nach Übungen."],
  [0, "Wischen und Zahnrad", "Auf dem Handy wischst du zwischen den drei Bereichen, quer siehst du zwei. Im Zahnrad findest du Hell und Dunkel, Erinnerungen, Updates und dieses Tutorial. Die zwei Beispielübungen kannst du jederzeit entfernen."]
];
let tourAt = -1;
function tour(i) {
  document.querySelectorAll(".pane.focus").forEach(p => p.classList.remove("focus"));
  const old = $(".tour"); if (old) old.remove();
  if (i < 0 || i >= TOUR.length) { tourAt = -1; kv.set("trainingsplaner.tutorial", 1); return; }
  tourAt = i;
  const s = TOUR[i];
  document.getElementById(PANES[s[0]]).classList.add("focus"); show(s[0]);
  const c = document.createElement("div");
  c.className = "tour"; c.setAttribute("role", "dialog"); c.setAttribute("aria-label", "Tutorial");
  c.innerHTML = '<span class="label">Tutorial · ' + (i + 1) + ' von ' + TOUR.length + '</span><h2 class="cond h2">' + s[1] + '</h2><p>' + s[2] + '</p>' +
    '<div class="duo"><button class="btn ghost" data-act="tourend">Beenden</button><button class="btn" data-act="tournext">' + (i === TOUR.length - 1 ? 'Fertig' : 'Weiter') + '</button></div>';
  document.body.append(c); c.querySelector('[data-act="tournext"]').focus();
}

/* Fenster unten und Rückgängig-Hinweis */
function sheet(html) { closeSheet(); const w = document.createElement("div"); w.className = "sheet-wrap"; w.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>'; w.addEventListener("click", e => { if (e.target === w) closeSheet(); }); document.body.append(w); const b = w.querySelector("button"); if (b) b.focus(); }
function closeSheet() { const w = $(".sheet-wrap"); if (w) w.remove(); }
let toastTimer = null;
function toast(msg, undo) {
  const old = $(".toast"); if (old) old.remove(); clearTimeout(toastTimer);
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button>Rückgängig</button>' : '');
  if (undo) t.querySelector("button").onclick = () => { undo(); t.remove(); };
  document.body.append(t); toastTimer = setTimeout(() => t.remove(), 7000);
}
function snapshot() { const s = JSON.stringify(st); return () => { st = JSON.parse(s); save(); render(); }; }

function addToDay(ds, id, scope) {
  if (scope === "day") st.days[ds] = dayList(st, ds).concat(id);
  else {
    st.plan[planWeek(st, ds)][weekday(ds)].push(id);
    if (st.days[ds]) st.days[ds].push(id);
  }
}

const ACT = {
  back: () => back(),
  day: d => openMid({ view: "day", ds: d.ds }),
  ex: (d, el) => { const next = { view: "ex", ds: d.ds || ui.ds, id: d.id }; if (el.closest("#p-week")) openMid(next, { view: "day", ds: next.ds }); else go(next); },
  week: d => { weekOff += Number(d.d); render(); },
  thisweek: () => { weekOff = 0; render(); },
  progress: () => show(2),
  settings: () => go({ view: "settings" }),
  sel: d => { prog.sel = d.key; render(); },
  single: () => { prog.single = !prog.single; render(); },
  form: (d, el) => {
    const ds = d.ds || ui.ds, next = { view: "form", ds: ds, f: { name: "", kind: "kraft", group: "", kg: "", reps: "10", sets: "3", track: "dauer", min: "30", kcal: "200", scope: "plan" } };
    if (el.closest("#p-week")) openMid(next, { view: "day", ds: ds }); else go(next);
  },
  edit: () => { const ex = st.ex[ui.id]; go({ view: "form", ds: ui.ds, id: ui.id, f: { name: ex.name, kind: ex.kind, group: ex.group || "", kg: num(ex.kg || 0), reps: String(ex.reps || ""), sets: String(ex.sets || ""), track: ex.track || "dauer", min: String(ex.min || 0), kcal: String(ex.kcal || 0) } }); },
  addexisting: d => { const undo = snapshot(); addToDay(ui.ds, d.id, ui.f.scope); save(); back(); toast(st.ex[d.id].name + " hinzugefügt", undo); },
  saveform: () => {
    const f = ui.f, name = f.name.trim();
    const fail = m => { ui.msg = m; render(); toast(m); };   // Meldung auch unten einblenden, die Zeile über dem Knopf übersieht man leicht
    if (!name) return fail("Bitte gib der Übung einen Namen.");
    const edit = ui.id, ex = edit ? st.ex[edit] : { kind: f.kind };
    let fields;
    if (ex.kind === "kraft") {
      if (!f.group) return fail("Bitte wähle eine Muskelgruppe oder einen Split.");
      const reps = Math.round(toNum(f.reps)), sets = Math.round(toNum(f.sets));
      if (reps < 1 || sets < 1) return fail("Reps und Sätze müssen mindestens 1 sein.");
      fields = { name: name, group: f.group, kg: toNum(f.kg), reps: reps, sets: sets };
    } else fields = { name: name, track: f.track, min: Math.round(toNum(f.min)), kcal: Math.round(toNum(f.kcal)) };
    Object.assign(ex, fields);
    if (!edit) { const id = uid(); st.ex[id] = ex; addToDay(ui.ds, id, f.scope); }
    save(); back(); toast(edit ? "Gespeichert" : name + " angelegt");
  },
  remove: d => {
    const ex = st.ex[d.id], ds = ui.ds, pl = planLabel(ds);
    sheet('<h2 class="cond h2">' + esc(ex.name) + ' entfernen?</h2><p class="muted">Deine Einträge bleiben im Fortschritt erhalten.</p>' +
      '<button class="btn danger" data-act="rm" data-id="' + d.id + '" data-scope="day">Nur am ' + fmt(ds) + '</button>' +
      '<button class="btn danger" data-act="rm" data-id="' + d.id + '" data-scope="plan">Jeden ' + WDL[weekday(ds)] + (pl ? ' (' + pl + ')' : '') + '</button>' +
      '<button class="btn ghost" data-act="close">Abbrechen</button>');
  },
  close: () => closeSheet(),
  pop: () => { if ($(".pop")) closePop(); else openPop(); },
  theme: d => { themeChoice = d.v; kv.set(THEME_KEY, themeChoice); applyTheme(); refreshPop(); },
  updcheck: () => {
    closePop(); updAsked = true;
    clearTimeout(updTimer);
    updTimer = setTimeout(() => { if (!updAsked) return; updAsked = false; showUpdate(true); }, 6000);   // spätestens nach 6 Sekunden eine Antwort
    checkUpdate();
  },
  updget: () => {
    if (!upd) return;
    if (app) { app.openDownload(upd.name); closeSheet(); toast("Download im Browser: Trainingsplaner-" + upd.name + ".apk öffnen und installieren"); return; }
    // Web-App: Offline-Speicher erneuern lassen, dann neu laden (die Seite selbst kommt mit Internet immer frisch)
    closeSheet(); toast("Wird aktualisiert …");
    const reload = () => location.reload();
    (navigator.serviceWorker && navigator.serviceWorker.getRegistration ? navigator.serviceWorker.getRegistration() : Promise.resolve(null))
      .then(r => r && r.update()).catch(() => { }).then(reload, reload);
  },
  plan: () => { closePop(); go({ view: "settings" }); },
  tour: () => { closePop(); tour(0); },
  tournext: () => tour(tourAt + 1),
  tourend: () => tour(-1),
  nosamples: () => {
    const undo = snapshot(), ids = Object.keys(st.ex).filter(id => st.ex[id].sample);
    ids.forEach(id => delete st.ex[id]);
    st.plan.forEach(w => w.forEach((day, i) => { w[i] = day.filter(id => ids.indexOf(id) < 0); }));
    Object.keys(st.days).forEach(ds => { st.days[ds] = st.days[ds].filter(id => ids.indexOf(id) < 0); });
    Object.keys(st.log).forEach(ds => { ids.forEach(id => delete st.log[ds][id]); if (!Object.keys(st.log[ds]).length) delete st.log[ds]; });
    if (ui.id && ids.indexOf(ui.id) >= 0) ui = startMid();
    save(); render(); toast("Beispiele entfernt", undo);
  },
  install: () => {
    if (!installPrompt) return installSheet();
    installPrompt.prompt();
    installPrompt.userChoice.catch(() => { }).then(() => { installPrompt = null; render(); });
  },
  rm: d => {
    const undo = snapshot(), ds = ui.ds;
    if (d.scope === "day") st.days[ds] = dayList(st, ds).filter(x => x !== d.id);
    else {
      const arr = st.plan[planWeek(st, ds)][weekday(ds)], i = arr.indexOf(d.id);
      if (i >= 0) arr.splice(i, 1);
      if (st.days[ds]) st.days[ds] = st.days[ds].filter(x => x !== d.id);
    }
    save(); closeSheet(); render(); toast("Entfernt", undo);
  },
  step: d => { const f = d.field; ui[f] = num(Math.max(0, toNum(ui[f]) + Number(d.d))); ui.msg = ""; render(); },
  saveset: () => {
    const kg = toNum(ui.kg), reps = Math.round(toNum(ui.reps));
    if (reps < 1) { ui.msg = "Bitte trage die Wiederholungen ein."; return render(); }
    const log = st.log[ui.ds] || (st.log[ui.ds] = {}), e = log[ui.id] || (log[ui.id] = { sets: [] });
    e.sets.push({ kg: kg, reps: reps }); ui.msg = ""; save(); render();
  },
  delset: d => {
    const undo = snapshot(), e = st.log[ui.ds][ui.id];
    e.sets.splice(Number(d.i), 1);
    if (!e.sets.length) delete st.log[ui.ds][ui.id];
    save(); render(); toast("Satz gelöscht", undo);
  },
  savecardio: () => {
    const ex = st.ex[ui.id], min = ex.track !== "kcal" ? Math.round(toNum(ui.min)) : 0, kcal = ex.track !== "dauer" ? Math.round(toNum(ui.kcal)) : 0;
    if (!min && !kcal) { ui.msg = "Bitte trage einen Wert ein."; return render(); }
    (st.log[ui.ds] || (st.log[ui.ds] = {}))[ui.id] = { min: min, kcal: kcal };
    ui.msg = "Gespeichert."; save(); render();
  },
  delcardio: () => { const undo = snapshot(); delete st.log[ui.ds][ui.id]; ui.msg = ""; save(); render(); toast("Eintrag gelöscht", undo); },
  copyab: () => { const undo = snapshot(); st.plan[1] = JSON.parse(JSON.stringify(st.plan[0])); save(); toast("Plan A nach B kopiert", undo); },
  export: () => {
    const text = JSON.stringify(st); ui.backup = text; ui.msg = ""; render();
    const ta = $("#backup"); ta.focus(); ta.select();
    const done = ok => { ui.msg = ok ? "Kopiert. Füge den Text z. B. in eine Notiz oder Mail an dich ein." : "Text markiert. Bitte selbst kopieren."; const m = $(".msg"); if (m) m.textContent = ui.msg; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), () => done(false)); else done(false);
  },
  import: () => {
    let data = null; try { data = valid(JSON.parse($("#backup").value)); } catch (e) { }
    if (!data) { ui.msg = "Das ist keine gültige Sicherung."; ui.backup = $("#backup").value; return render(); }
    sheet('<h2 class="cond h2">Sicherung einspielen?</h2><p class="muted">Alle Daten in dieser App werden durch die Sicherung ersetzt.</p><button class="btn danger" data-act="doimport">Ersetzen</button><button class="btn ghost" data-act="close">Abbrechen</button>');
    ui.pending = data;
  },
  doimport: () => { const undo = snapshot(); st = ui.pending; ui.pending = null; ui.backup = ""; ui.msg = "Sicherung eingespielt."; save(); closeSheet(); render(); toast("Sicherung eingespielt", undo); }
};

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b.dataset, b);
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.field) ui[el.dataset.field] = el.value;
  if (el.dataset.f) ui.f[el.dataset.f] = el.value;
  if (el.id === "backup") ui.backup = el.value;
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.rm != null) {
    if (el.dataset.rm === "on") { rm.on = el.checked; if (rm.on && app && app.askNotify) app.askNotify(); refreshPop(); }
    else rm.times[+el.dataset.rm] = el.value;
    writeReminders();
    return;
  }
  if (el.dataset.radio) { ui.f[el.dataset.radio] = el.value; ui.msg = ""; render(); const n = document.querySelector('[data-radio="' + el.dataset.radio + '"]:checked'); if (n) n.focus(); }
  if (el.dataset.setting === "rhythm") { st.rhythm = Number(el.value); save(); render(); }
  if (el.dataset.setting === "week") { const m = monday(today()); st.start = el.value === "A" ? m : addDays(m, -7); save(); render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && window.appBack()) e.preventDefault();
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.field) { e.preventDefault(); ACT[ui.view === "ex" && st.ex[ui.id] && st.ex[ui.id].kind === "kardio" ? "savecardio" : "saveset"](); }
});

render();
// Start immer ganz links bei der Woche
deck.scrollLeft = 0;
requestAnimationFrame(() => { deck.scrollLeft = 0; depth(); });
depth();
if (firstRun) save(); else writeReminders();
if (app) {
  // Nach einem Update einmal „Update erfolgreich!“ mit den Neuerungen dieser Version
  const cur = app.versionCode(), last = kv.get("trainingsplaner.appVersion", 0);
  if (last ? last < cur : app.wasUpdated()) {
    let notes = [];
    try { notes = (JSON.parse(app.patchNotes()).find(x => +x.code === cur) || {}).notes || []; } catch (e) { }
    updSheet("Update erfolgreich!", "Du hast jetzt Version " + app.versionName() + ".", notes);
  }
  kv.set("trainingsplaner.appVersion", cur);
  app.checkUpdate();
}
if (webUpd) {
  // Web-App: nach einer neuen Version einmal „Update erfolgreich!“, danach im Hintergrund nach Updates sehen
  const cur = curCode(), last = kv.get("trainingsplaner.webVersion", 0);
  // auch beim ersten Start mit dieser Funktion, wenn schon Daten da sind (Update von 1.6 oder älter)
  if (last ? last < cur : !firstRun) updSheet("Update erfolgreich!", "Du hast jetzt Version " + curName() + ".", window.WEB_NOTES || []);
  kv.set("trainingsplaner.webVersion", cur);
  checkUpdate();
}
if (firstRun && !kv.get("trainingsplaner.tutorial", 0)) setTimeout(() => tour(0), 400);
if (!native) { try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => { }); } catch (e) { } }
if (!native && window.claude && window.claude.use) {
  window.claude.use("db").then(async d => {
    if (!d) return;
    db = d;
    try {
      const snap = await db.doc("zustand/haupt").get();
      const remote = snap.exists ? valid(JSON.parse(snap.data().json)) : null;
      if (remote) { st = remote; try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { } ui = startMid(); render(); } else save();
    } catch (e) { }
  }).catch(() => { });
}
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script></body>
